# Ogni 2 ore aggiorna intelligence/news.json, rifà intelligence/index.html e ripubblica
name: Notizie
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: news
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node news.js && node render.js
        working-directory: intelligence
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet intelligence/news.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Notizie $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
          # un push fatto con github.token non riavvia Pages da solo
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
