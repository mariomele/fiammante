<style>

main{padding:22px 0 30px}

.qg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:10px;overflow:hidden;margin-bottom:14px}

.kpi:hover{border-color:var(--mut)}.kpi small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}

.feed{list-style:none;margin:0;padding:0}.feed li{display:grid;grid-template-columns:78px 130px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--ln);font-size:13px}.feed li:first-child{border-top:0}
.feed time,.feed em{color:var(--mut);font-style:normal;font-size:12px}.feed b{font-weight:600;font-size:12px;color:var(--ac);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.feed a{color:var(--tx);text-decoration:none;overflow-wrap:anywhere;min-width:0}.feed a:hover{text-decoration:underline}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}

th button{background:none;border:0;color:inherit;cursor:pointer;padding:0}th button[aria-pressed=true]{color:var(--tx)}
td{padding:7px 8px;border-top:1px solid var(--ln);text-align:right;white-space:nowrap}td a{color:inherit;text-decoration:none}
tr.me td{background:var(--p2)}tr.me td:first-child{color:var(--me);font-weight:600}.na{color:var(--ln)}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--p);border:1px solid var(--ln);border-radius:8px;padding:2px;margin-bottom:12px}

.note{font-size:12px;color:var(--mut)}
.pager{display:flex;justify-content:space-between;gap:10px;padding:0 16px 30px}.pager a{color:var(--mut);text-decoration:none;font-size:13px;border:1px solid var(--ln);border-radius:8px;padding:8px 12px}.pager a:hover{color:var(--tx)}
footer{color:var(--mut);font-size:11.5px;padding-bottom:40px}

.chips button[aria-pressed=true]{color:var(--tx);border-color:var(--ac)}.chips button.me{color:var(--me)}
.ok{color:var(--grn);font-weight:400}.sub{display:block;color:var(--mut);font-size:11px;white-space:normal}
table.mx td,table.mx th{text-align:center}table.mx td:first-child{text-align:left;white-space:normal;min-width:150px}
em.up{color:var(--grn);font-style:normal}em.dn{color:var(--red);font-style:normal}
.maprow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.map{width:100%;max-height:640px}.map .rg path{fill:var(--p2);stroke:var(--ln);stroke-width:.8}.map circle{fill:var(--ac);stroke:var(--bg);stroke-width:1.2;opacity:.9}.map circle.me{fill:var(--me)}.map circle.t-altro{opacity:.55}
.lgd{color:var(--ac)}.lgd.me{color:var(--me)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.tgrid .card{margin:0}.card.mine{border-color:var(--me)}
.sbar.sm{grid-template-columns:90px 1fr 34px;margin:3px 0}.sbar.sm div{height:8px}
.vpl{display:grid;gap:0;margin:6px 0 14px}.vpi{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:10px 0;border-top:1px solid var(--ln)}.vpd time{display:block;font:600 12px ui-monospace,Menlo,monospace;color:var(--tx)}.vpd i{display:inline-block;margin-top:5px;font:normal 600 10px/1.3 system-ui;padding:2px 7px;border-radius:9px;color:var(--c);border:1px solid var(--c)}.vpt b{font-weight:600;font-size:14px}.vpt p{margin:3px 0 4px;color:var(--mut);font-size:13px;line-height:1.45;max-width:78ch}.vpt a{font-size:12px;color:var(--ac);text-decoration:none}.vph{margin:6px 0 6px;font:600 11px ui-monospace,Menlo,monospace;text-transform:uppercase;color:var(--mut)}
@media(max-width:620px){.vpi{grid-template-columns:1fr;gap:4px}.vpd{display:flex;gap:8px;align-items:center}.vpd i{margin:0}}
th.meh{color:var(--me)}
/* logo, nastro ULTIME, barre divergenti e impilate */
.logo{display:flex;align-items:center;gap:10px}#lgi{height:26px;background:#fff;border-radius:6px;padding:4px 8px;box-sizing:content-box;display:block}.lgt{font-style:normal}

.tkm{display:inline-flex;gap:38px;white-space:nowrap;padding-left:16px;animation:tk 110s linear infinite}.tick:hover .tkm{animation-play-state:paused}.tkm a{color:var(--tx);text-decoration:none}.tkm b{color:var(--ac);font-weight:600;margin-right:4px}.tkm em{color:var(--mut);font-style:normal}

const MESI=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'],TPAL=['#5b9cf0','#5fd08a','#c678dd','#f5a524','#2ec4b6','#ff8fab','#e5c07b','#56b6c2','#ef6f6c'];
function tline(B,meIx){const P=B.p||[];if(P.length<8)return'';const W=760,H=260,l=34,r=12,t=10,b=24,n=P.length,X=i=>l+i/(n-1)*(W-l-r),Y=v=>H-b-v/100*(H-t-b),cl=i=>i===meIx?'var(--me)':TPAL[i%TPAL.length];
  const yrs=[...new Set(P.map(p=>p[0].slice(0,4)))];
  return`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img">${[0,50,100].map(v=>`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--ln)"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`).join('')}
  ${yrs.map(y=>{const i=P.findIndex(p=>p[0].startsWith(y));return i>0?`<line x1="${X(i)}" x2="${X(i)}" y1="${t}" y2="${H-b}" stroke="var(--ln)" stroke-dasharray="2 4"/><text x="${X(i)+4}" y="${H-6}">${y}</text>`:''}).join('')}
  ${B.kw.map((k,j)=>`<polyline fill="none" stroke="${cl(j)}" stroke-width="${j===meIx?2.6:1.6}" points="${P.map((p,i)=>p[j+1]==null?'':X(i).toFixed(1)+','+Y(p[j+1]).toFixed(1)).join(' ')}"><title>${esc(k)}</title></polyline>`).reverse().join('')}</svg>
  <p class="note">${B.kw.map((k,j)=>`<span style="color:${cl(j)}">■</span> ${esc(k)}`).join(' · ')}</p>`}
const tavg=(P,j,f)=>{const a=P.filter(f).map(p=>p[j+1]).filter(v=>v!=null);return a.length?a.reduce((s,v)=>s+v,0)/a.length:null};
function trends(){
  const T=D.trends;if(!T)return ND;const C=T.cat,Bs=[T.brand,T.brand2].filter(b=>b&&(b.p||[]).length);
  const last=P=>P[P.length-1][0],yoy=(P,j)=>{if(P.filter(p=>p[j+1]==null).length>P.length/2)return null;const e=new Date(last(P)),d=x=>(e-new Date(x))/864e5,a=tavg(P,j,p=>d(p[0])<365),b=tavg(P,j,p=>d(p[0])>=365&&d(p[0])<730);return a!=null&&b?(a/b-1)*100:null};
  const seas=C?C.kw.map((k,j)=>MESI.map((_,m)=>tavg(C.p,j,p=>+p[0].slice(5,7)===m+1))):[];
  const reg=(R,me)=>{if(!R||!D.geo)return'';const I=D.geo,pt=I.r.flatMap(r=>r[1].flat()),lo=pt.map(p=>p[0]),la=pt.map(p=>p[1]),x0=Math.min(...lo),x1=Math.max(...lo),y0=Math.min(...la),y1=Math.max(...la),k=Math.cos((y0+y1)/2*Math.PI/180),sc=420/((x1-x0)*k),X=l=>(l-x0)*k*sc,Y=l=>(y1-l)*sc,Pt=r=>'M'+r.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('L')+'Z',v=n=>R.v[n]??R.v[n.split('/')[0]],mx=Math.max(...Object.values(R.v),1),rk=Object.entries(R.v).sort((a,b)=>b[1]-a[1]);
    return`<div class="card"><h3>Dove si cerca «${esc(R.kw)}»</h3><div class="maprow"><svg class="map" viewBox="-6 -6 432 ${((y1-y0)*sc+12).toFixed(0)}" role="img">${I.r.map(r=>{const x=v(r[0]);return`<path d="${r[1].map(Pt).join('')}" style="fill:${x==null?'var(--p2)':hc(x/mx,me?'var(--me)':'var(--ac)')};stroke:var(--bg)" data-tip="${esc(r[0]+': '+(x==null?'dato non disponibile':x+' su 100'))}"/>`}).join('')}</svg><div>${rk.slice(0,8).map(([n,x])=>`<div class="sbar sm${me?' me':''}"><span>${esc(n.split('/')[0])}</span><div style="width:${x/mx*100}%"></div><b>${x}</b></div>`).join('')}<p class="note">100 = la regione dove la ricerca pesa di più sul totale delle ricerche locali.</p></div></div></div>`};
  return`${C?`<div class="card"><h3>Ricerche di categoria su Google, ultimi 5 anni</h3>${tline(C,-1)}</div>`:''}
  <div class="maprow">${C?`<div class="card tw"><h3>Stagionalità: interesse medio per mese</h3><table class="mx vm"><thead><tr><th></th>${MESI.map(m=>`<th>${m}</th>`).join('')}</tr></thead><tbody>${C.kw.map((k,j)=>{const mx=Math.max(...seas[j].filter(v=>v!=null),1);return`<tr><td>${esc(k)}</td>${seas[j].map((v,m)=>v==null?'<td>·</td>':`<td style="background:${hc(v/mx)}" data-tip="${esc(k+' · '+MESI[m]+': '+Math.round(v)+' (media 5 anni)')}">${Math.round(v)}</td>`).join('')}</tr>`}).join('')}</tbody></table><p class="note">Ogni riga ha la sua scala: il mese più scuro è il picco di quella ricerca. Utile per il calendario di campagne e promozioni.</p></div>`:''}
  ${C?`<div class="card"><h3>Ultimi 12 mesi contro i 12 prima</h3>${[...C.kw.map((k,j)=>[k,yoy(C.p,j),0]),...Bs.flatMap(B=>B.kw.map((k,j)=>[k,yoy(B.p,j),B.ids?.[j]===ME?1:0]))].filter((x,i,a)=>x[1]!=null&&a.findIndex(y=>y[0]===x[0])===i).sort((a,b)=>b[1]-a[1]).map(([k,p,me])=>{const mx=Math.max(...[...C.kw.map((_,j)=>yoy(C.p,j)),...Bs.flatMap(B=>B.kw.map((_,j)=>yoy(B.p,j)))].filter(v=>v!=null).map(Math.abs),1);return`<div class="dbar"><span${me?' style="color:var(--me)"':''}>${esc(k)}</span><div><i style="${p<0?'right':'left'}:50%;width:${(Math.abs(p)/mx*50).toFixed(1)}%;background:${qC(p)}"></i></div><b style="color:${qC(p)}">${qF(p)}</b></div>`}).join('')}<p class="note">Media dell'interesse negli ultimi 12 mesi rispetto ai 12 precedenti.</p></div>`:''}</div>
  ${Bs.map((B,i)=>`<div class="card"><h3>${i?'Altri marchi a confronto':'Quanto si cercano i marchi'}</h3>${tline(B,(B.ids||[]).indexOf(ME))}</div>`).join('')}

}

  if(d.sort){ST.dir=ST.sort===d.sort?-ST.dir:-1;ST.sort=d.sort}else if(d.hl)ST.hl=ST.hl===d.hl?'':d.hl;else if(d.hm)ST.hm=d.hm;else ST.m=d.m;if(b.tagName==='BUTTON')show()});
main.addEventListener('change',e=>{if(e.target.dataset.sel){ST[e.target.dataset.sel]=e.target.value;show();return}if(e.target.id==='nf'){ST.f=e.target.value;show()}if(e.target.id==='sf'){ST.sf=e.target.value;show()}});
q.addEventListener('input',()=>{ST.q=q.value.trim().toLowerCase();show()});
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.hidden=true;return}tip.hidden=false;tip.textContent=t.dataset.tip;tip.style.left=Math.max(8,Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8))+'px';tip.style.top=(e.clientY+16)+'px'});
addEventListener('hashchange',()=>{show();scrollTo(0,0)});
show();
</script>
